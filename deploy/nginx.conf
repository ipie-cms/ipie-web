# Serving rules for the ipie-web bundle.
#
# Three things this file has to get right: single-page routing, cache lifetimes that differ between
# the immutable bundle and the mutable configuration, and the security headers a static bundle
# cannot set for itself.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change whenever their content does, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The opposite case. This file differs per environment and is replaced at deploy time, so a
    # cached copy would leave a promoted bundle talking to the environment it came from.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # index.html names the current asset hashes; caching it pins the browser to an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: /dashboard and friends are not files on disk, so anything that is not a
    # real file falls through to the application rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers the application cannot set for itself. The CSP is deliberately strict about scripts
    # and deliberately permissive about connect-src, which has to reach whatever backend and
    # identity endpoints /config.json names - tighten it per environment once those are fixed
    # (ARCHITECTURE_PLAN.md section 15).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
